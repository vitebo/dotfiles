# ~/.config/tmux/status-line.conf -> packages/tmux/config/status-line.conf
#
# Status line: current session | windows | user, at the top, with rounded edges.
# - Catppuccin colors, Latte or Mocha following the terminal's light / dark mode
#   (Ghostty follows macOS), switched live by tmux itself (see Palette and Roles).
# Nerd Font icons: the terminal renders them (Ghostty embeds them).
# Hex colors rather than the terminal's 16 ANSI ones (CLAUDE.md "Themes"): the bar
# needs Catppuccin's mantle / surface / mauve, which aren't in Ghostty's 16 colors.

## Palette. tmux's theme colours (`themeblack`, `thememagenta`...) resolve to the
## `light-theme-*` or `dark-theme-*` value depending on the background the client
## reports (`theme detect`, the default; an unknown one counts as dark). tmux's
## own styles (messages, menus, copy mode, popups) use them with their meaning:
## black is the darkest color and white the lightest, in both themes.
##                                 Latte                      Mocha
set-option -g light-theme-black      "#4c4f69" ; set-option -g dark-theme-black      "#181825"  # text / mantle
set-option -g light-theme-white      "#eff1f5" ; set-option -g dark-theme-white      "#cdd6f4"  # base / text
set-option -g light-theme-light-grey "#bcc0cc" ; set-option -g dark-theme-light-grey "#a6adc8"  # surface1 / subtext0
set-option -g light-theme-dark-grey  "#6c6f85" ; set-option -g dark-theme-dark-grey  "#45475a"  # subtext0 / surface1
set-option -g light-theme-magenta    "#8839ef" ; set-option -g dark-theme-magenta    "#cba6f7"  # mauve
set-option -g light-theme-red        "#d20f39" ; set-option -g dark-theme-red        "#f38ba8"  # red
set-option -g light-theme-green      "#40a02b" ; set-option -g dark-theme-green      "#a6e3a1"  # green
set-option -g light-theme-yellow     "#df8e1d" ; set-option -g dark-theme-yellow     "#f9e2af"  # yellow
set-option -g light-theme-blue       "#1e66f5" ; set-option -g dark-theme-blue       "#89b4fa"  # blue
set-option -g light-theme-cyan       "#179299" ; set-option -g dark-theme-cyan       "#94e2d5"  # teal

## Roles, as user options (`@...`) holding a format: the Latte color when the
## client reports a light background (`client_theme`), else the Mocha one. Used
## below as `#{E:@dot_...}`, expanded each time the status line is drawn.
##                                                                Latte    Mocha
set-option -g @dot_bar        "#{?#{==:#{client_theme},light},#e6e9ef,#181825}"  # mantle: status line background
set-option -g @dot_text       "#{?#{==:#{client_theme},light},#6c6f85,#a6adc8}"  # subtext0: status line text
set-option -g @dot_current_fg "#{?#{==:#{client_theme},light},#eff1f5,#11111b}"  # base / crust: current
set-option -g @dot_current_bg "#{?#{==:#{client_theme},light},#8839ef,#cba6f7}"  #   window, on mauve
set-option -g @dot_last_fg    "#{?#{==:#{client_theme},light},#4c4f69,#cdd6f4}"  # text: last active
set-option -g @dot_last_bg    "#{?#{==:#{client_theme},light},#bcc0cc,#45475a}"  #   window, on surface1
set-option -g @dot_other_fg   "#{?#{==:#{client_theme},light},#6c6f85,#a6adc8}"  # subtext0: other
set-option -g @dot_other_bg   "#{?#{==:#{client_theme},light},#e6e9ef,#181825}"  #   windows, on mantle
set-option -g @dot_alert_fg   "#{?#{==:#{client_theme},light},#eff1f5,#11111b}"  # base / crust: Claude
set-option -g @dot_alert_bg   "#{?#{==:#{client_theme},light},#d20f39,#f38ba8}"  #   needs you, on red

## tmux's own styles drawing dark text on yellow / teal / mauve: unreadable on
## Latte's mid-tone accents, so they use the grey slots instead, readable in both
## themes (white on dark grey, black on light grey). Not the roles above: copy
## mode styles are drawn without a client, so `client_theme` is empty there. The
## `fill=` part is tmux's default, kept.
set-option -g message-style "fg=themewhite,bg=themedarkgrey,\
#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themedarkgrey}"
set-option -g message-command-style "fg=themeblack,bg=themelightgrey,\
#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themelightgrey}"
set-option -g mode-style "fg=themeblack,bg=themelightgrey"
set-option -g menu-selected-style "fg=themeblack,bg=themelightgrey"
set-option -g copy-mode-match-style "fg=themewhite,bg=themedarkgrey"
set-option -g copy-mode-mark-style "fg=themewhite,bg=themedarkgrey"
set-option -g copy-mode-current-match-style "fg=themeblack,bg=themelightgrey"

set-option -g status-position top
set-option -g status-style "fg=#{E:@dot_text},bg=#{E:@dot_bar}"
set-option -g status-left-length 100
set-option -g status-right-length 100

## A second, empty status line in the terminal's background, as a gap between the
## bar (on top) and the panes.
set-option -g status 2
set-option -g status-format[1] "#[fill=default,bg=default]"

## Left: rounded edge, then a tmux icon and the current session, in bold. Only
## that one: `prefix s` lists them all.
set-option -g status-left "#[fg=#{E:@dot_bar},bg=default]#[bg=#{E:@dot_bar}]"  # left half circle (\ue0b6)
set-option -ag status-left "#[fg=#{E:@dot_text}] #[bold]#{session_name}#[nobold]   "  # tmux icon (\uebc8)

## Claude Code state (claude-hook.sh, run by Claude Code's hooks): the most urgent
## one among a window's / session's panes. An icon before the window name: bell
## when Claude needs you (permission prompt, question), check when it finished its
## turn and you haven't looked yet, double check once you have, hourglass while it
## works.
set-option -g @dot_claude_icon "#{?#{==:#{@claude_window},attention},\U000f009e ,\
#{?#{==:#{@claude_window},done},\U000f012c ,#{?#{==:#{@claude_window},read},\U000f012d ,\
#{?#{==:#{@claude_window},working},\U000f051f ,}}}}"
## Other windows needing you are drawn on red (the current one keeps its colors).
set-option -g @dot_claude_alert "#{?#{==:#{@claude_window},attention},#[fg=#{E:@dot_alert_fg}#,bg=#{E:@dot_alert_bg}],}"

## Centre: windows as `index:name<flags>`, two spaces apart, after the Claude icon.
set-option -g window-status-separator "  "
set-option -g window-status-current-style "fg=#{E:@dot_current_fg},bg=#{E:@dot_current_bg},bold"
set-option -g window-status-last-style "fg=#{E:@dot_last_fg},bg=#{E:@dot_last_bg}"
set-option -g window-status-style "fg=#{E:@dot_other_fg},bg=#{E:@dot_other_bg}"
set-option -g window-status-current-format " #{E:@dot_claude_icon}#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-format "#{E:@dot_claude_alert} #{E:@dot_claude_icon}#{window_index}:#{window_name}#{window_flags} "

## Right: other sessions where Claude needs you (bell + name, on red), then the
## current kubectl context (packages/kubectl), then rounded edge. `prefix + a` jumps
## to those sessions. The context is read every status-interval (15s) from the
## kubeconfig, no network; EKS ARNs are cut to the cluster name (after the last
## `/`). Hidden without kubectl (eg in a devcontainer) or without a context.
set-option -g status-right "#{S:#{?#{&&:#{==:#{@claude_session},attention},#{!=:#{session_name},#{client_session}}},\
#[fg=#{E:@dot_alert_fg}#,bg=#{E:@dot_alert_bg}] \U000f009e #{session_name} #[fg=#{E:@dot_text}#,bg=#{E:@dot_bar}]  ,}}"
set-option -ag status-right "#[fg=#{E:@dot_text}]#(command -v kubectl >/dev/null && kubectl config current-context 2>/dev/null | sed 's|.*/||; s|^|󱃾 |')"  # kubernetes icon (\U000F10FE)
set-option -ag status-right "#[fg=#{E:@dot_bar},bg=default]"  # right half circle (\ue0b4)
