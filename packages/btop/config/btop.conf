# btop config: only our changes, btop's defaults apply for the rest
# (`btop --default-config` prints them). Options:
# https://github.com/aristocratos/btop#configurability

# dotfiles: built-in theme made of the terminal's 16 ANSI colors, so it follows
# Ghostty's Catppuccin Latte / Mocha.
color_theme = "TTY"

# dotfiles: no theme background, the terminal's one shows through.
theme_background = false

# dotfiles: never rewrite this versioned file on exit (it would drop these comments
# and freeze every default); change settings here instead of in btop's menu.
save_config_on_exit = false
