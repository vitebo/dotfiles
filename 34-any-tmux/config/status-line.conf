# ~/.config/tmux/status-line.conf -> 34-any-tmux/config/status-line.conf
#
# Status line, laid out like gnugat's (sessions | windows | user, at the top,
# with rounded edges), without its Catppuccin plugin and session script:
# - colors are neutral, matching JankyBorders / SketchyBar (no theme yet);
# - sessions are listed with tmux's own `#{S:...}` loop.
# Nerd Font icons: the terminal renders them (Ghostty embeds them).

## Palette, as user options (`@...`), used below as `#{@dot_...}`.
set-option -g @dot_bar        "#26282f"  # status line background
set-option -g @dot_text       "#b5b8c0"  # status line text
set-option -g @dot_current_fg "#e2e2e3"  # current session / window (JankyBorders active)
set-option -g @dot_current_bg "#414550"  #   (JankyBorders inactive)
set-option -g @dot_last_fg    "#c0c3cb"  # last active session / window
set-option -g @dot_last_bg    "#33363f"
set-option -g @dot_other_fg   "#8b8f99"  # other sessions / windows
set-option -g @dot_other_bg   "#2c2e35"

set-option -g status-position top
set-option -gF status-style "fg=#{@dot_text},bg=#{@dot_bar}"
set-option -g status-left-length 100
set-option -g status-right-length 100

## Left: rounded edge, then sessions as `[name<flag>]`, flag being `*` for the
## current one and `-` for the last active one, then a tmux icon.
set-option -g status-left "#[fg=#{@dot_bar},bg=default]#[bg=#{@dot_bar}]"  # left half circle (\ue0b6)
set-option -ag status-left "#{S:\
#{?#{==:#{session_name},#{client_session}},\
#[fg=#{@dot_current_fg}]#[bg=#{@dot_current_bg}]#[bold],\
#{?#{==:#{session_name},#{client_last_session}},\
#[fg=#{@dot_last_fg}]#[bg=#{@dot_last_bg}],\
#[fg=#{@dot_other_fg}]#[bg=#{@dot_other_bg}]}}\
[#{session_name}\
#{?#{==:#{session_name},#{client_session}},*,#{?#{==:#{session_name},#{client_last_session}},-,}}]\
#[default]#[bg=#{@dot_bar}] }"
set-option -ag status-left "#[fg=#{@dot_text}] "  # tmux icon (\uebc8)

## Centre: windows as `index:name<flags>`.
set-option -gF window-status-current-style "fg=#{@dot_current_fg},bg=#{@dot_current_bg},bold"
set-option -gF window-status-last-style "fg=#{@dot_last_fg},bg=#{@dot_last_bg}"
set-option -gF window-status-style "fg=#{@dot_other_fg},bg=#{@dot_other_bg}"
set-option -g window-status-current-format " #{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-format " #{window_index}:#{window_name}#{window_flags} "

## Right: user (truncated to 15 characters), then rounded edge.
set-option -g status-right "#[fg=#{@dot_text}] #{=/15/…/:user}"  # user icon (\uf007)
set-option -ag status-right "#[fg=#{@dot_bar},bg=default]"  # right half circle (\ue0b4)

## Refresh the session list as soon as sessions change (instead of every
## status-interval).
set-hook -g session-created "refresh-client -S"
set-hook -g session-closed "refresh-client -S"
set-hook -g session-renamed "refresh-client -S"
set-hook -g client-session-changed "refresh-client -S"
