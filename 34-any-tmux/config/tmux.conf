# ~/.config/tmux/tmux.conf -> 34-any-tmux/config/tmux.conf
#
# tmux defaults (prefix: Ctrl+b), plus a few essentials, each marked
# "dotfiles:". tmux ships no default config file.
# Reference: `man tmux`, list bindings with `prefix ?`.

# dotfiles: Esc is passed on after 10ms instead of 500ms (default before tmux 3.5,
# still shipped by some distros), so leaving insert mode in nvim isn't delayed.
set-option -s escape-time 10

# dotfiles: mouse support: click to focus panes / windows, drag borders to resize,
# scroll the history.
set-option -g mouse on

# dotfiles: windows and panes numbered from 1 (like the keyboard), and windows
# renumbered when one is closed.
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# dotfiles: new windows and splits open in the current pane's directory
# (instead of the session's start directory).
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# dotfiles: vim-like pane navigation with prefix + h/j/k/l, not alt+h/j/k/l:
# AeroSpace (23-mac-aerospace) takes those keys first.
# `l` was "last window": moved to prefix + L.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key L last-window

# dotfiles: vim-like copy mode (prefix + [): v to select, ctrl+v for a block,
# y to copy and quit.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# dotfiles: copies also go to the system clipboard, through the terminal (OSC 52,
# supported by Ghostty), so it works in devcontainers too, without pbcopy / xclip.
set-option -g set-clipboard on

# dotfiles: pass modified keys (eg shift+enter, which Claude Code uses for a new
# line) on to apps that ask for them, instead of sending a plain enter. The outer
# terminal must send them to tmux too (`extkeys`; Ghostty supports it), and they
# are passed on as CSI u, the format most apps (and Ghostty itself) use.
set-option -s extended-keys on
set-option -s extended-keys-format csi-u
set-option -as terminal-features 'xterm*:extkeys'

# dotfiles: let apps send escape sequences straight to the outer terminal, so
# chafa (54-any-chafa) shows images with Ghostty's kitty graphics protocol inside
# tmux instead of falling back to Unicode blocks, and Claude Code's desktop
# notifications reach Ghostty (21-any-claude-code).
set-option -g allow-passthrough on

# dotfiles: tell apps when the terminal gains or loses focus, so Claude Code knows
# when you're away and notifies you (recommended by its terminal docs).
set-option -g focus-events on

# dotfiles: prefix + a opens a menu with every pane running Claude Code, the ones
# that need you first, with their state icon (claude-agents.sh); Enter or the
# item's number jumps there. Default `a` is unbound.
bind-key a run-shell "~/.config/tmux/claude-agents.sh '#{client_name}'"

# dotfiles: looking at a pane where Claude Code finished its turn marks it as read
# (claude-hook.sh), so its window shows a double check instead of a check. Needs
# focus-events (below).
set-hook -g pane-focus-in "run-shell -b '[ ! -f ~/.claude/hooks/tmux-agent-state.sh ] || bash ~/.claude/hooks/tmux-agent-state.sh read #{pane_id}'"

# dotfiles: prefix + r reloads this file.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# dotfiles: status line, in its own file.
source-file ~/.config/tmux/status-line.conf
